[package]
name = "zcode-hub"
version = "1.10.401"
description = "ZCode 多账号工作台 · 切换 / 额度 / 领取 / 网关"
license = "MIT"
edition = "2021"
# bin/gatewayd.rs 是第二个二进制（无头网关）；tauri dev 的 cargo run 需要 default-run 指主程序
default-run = "zcode-hub"

[lib]
name = "zcode_hub_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-dialog = "2"
tauri-plugin-autostart = "2"
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
uuid = { version = "1", features = ["v4"] }
chrono = "0.4"
aes-gcm = "0.10"
base64 = "0.22"
pbkdf2 = { version = "0.12", default-features = false, features = ["hmac"] }
ureq = { version = "3", features = ["json", "rustls"] }
sys-locale = "0.3"
axum = { version = "0.7", default-features = false, features = ["http1", "json", "tokio"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls"] }
bytes = "1"
tokio-stream = "0.1"

# 应用内更新（updater 产物签名见 release.yml 的 TAURI_SIGNING_PRIVATE_KEY）
[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-updater = "2"
tauri-plugin-process = "2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.52", features = [
    "Win32_System_Console",
    "Win32_Storage_FileSystem",
    "Win32_Foundation",
    "Win32_Security",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

[target.'cfg(not(windows))'.dependencies]
# X-Client-Timezone 的 IANA 名（Node Intl 同源）
iana-time-zone = "0.1"

[target.'cfg(target_os = "macos")'.dependencies]
# 原生玻璃（glass.rs）：NSGlassEffectView / NSVisualEffectView 挂在 WKWebView 下方；
# objc2 族限定 macOS 目标，Windows/Linux 构建完全不参与编译
objc2 = "0.6"
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSResponder", "NSView", "NSGraphics", "NSAppearance", "NSGlassEffectView", "NSVisualEffectView", "objc2-core-foundation", "objc2-quartz-core"] }
objc2-core-foundation = { version = "0.3", default-features = false, features = ["std", "CFCGTypes"] }
objc2-core-graphics = { version = "0.3", default-features = false, features = ["std", "CGColor", "CGPath"] }
objc2-quartz-core = { version = "0.3", default-features = false, features = ["std", "CALayer", "CAShapeLayer", "CATransaction", "objc2-core-foundation", "objc2-core-graphics"] }

[profile.release]
strip = "symbols"
lto = "thin"
