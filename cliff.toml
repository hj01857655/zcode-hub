# git-cliff 配置：conventional commits → 分类式 release notes（GitHub Releases 用）。
# 分类锚点用 HTML 注释保证渲染顺序（git-cliff 惯例）；chore(release) 不进 notes。
[changelog]
header = ""
trim = true
footer = ""
body = """
{%- if version %}
## {{ version }}
{% endif -%}
{% for group, commits in commits | group_by(attribute="group") %}

### {{ group }}

{% for commit in commits %}
- {% if commit.scope %}**{{ commit.scope }}**: {% endif %}{{ commit.message | split(pat="\n") | first | upper_first | trim_end }}
{% endfor %}
{%- endfor %}
"""

[git]
conventional_commits = true
filter_unconventional = true
split_commits = false
tag_pattern = "v[0-9].*"
commit_parsers = [
  { message = "^feat", group = "🚀 新功能" },
  { message = "^fix", group = "🐛 修复" },
  { message = "^style", group = "🎨 样式" },
  { message = "^perf", group = "⚡ 性能" },
  { message = "^refactor", group = "♻️ 重构" },
  { message = "^docs", group = "📚 文档" },
  { message = "^test", group = "🧪 测试" },
  { message = "^ci", group = "⚙️ 构建/CI" },
  { message = "^chore\\(release\\)", skip = true },
  { message = "^chore", group = "🔧 杂项" },
  { message = ".*", group = "🌀 其他" },
]
filter_commits = true
