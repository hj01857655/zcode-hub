name: Release

on:
  push:
    tags: ['v*']
  # 手动触发：darwin 腿编译验证玻璃层等 mac-only 改动时不必打 tag 出正式 release
  workflow_dispatch:
    inputs:
      prerelease:
        description: 'Mark release as prerelease'
        type: boolean
        default: true

jobs:
  build:
    name: Build & Release (${{ matrix.os }} · ${{ matrix.arch }})
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write

    strategy:
      fail-fast: false
      matrix:
        include:
          # Windows x64：NSIS，native runner 默认 target
          - os: windows-latest
            bundles: nsis
            arch: x64
          # Windows ARM64：交叉编译（--target），依赖 runner 镜像的 MSVC ARM64 组件；
          # 单条腿失败不影响其它腿（fail-fast: false）
          - os: windows-latest
            bundles: nsis
            arch: arm64
            rust_target: aarch64-pc-windows-msvc
          # macOS Apple Silicon：macos-latest 原生即 arm64；app 产出更新器要的 .app.tar.gz，dmg 仍给用户装
          - os: macos-latest
            bundles: app,dmg
            arch: aarch64
          # macOS Intel：强制 x86_64 target
          - os: macos-latest
            bundles: app,dmg
            arch: x64
            rust_target: x86_64-apple-darwin
          # Linux amd64：deb + appimage，native
          - os: ubuntu-22.04
            bundles: deb,appimage
            arch: amd64
          # Linux arm64：GitHub 原生 ARM runner（仅公开仓库可用），apt 依赖与 x64 同名（解析到 arm64 包）；
          # 用 22.04 与 amd64 腿对齐 glibc 基线，避免同一 release 两架构最低系统版本不一致
          - os: ubuntu-22.04-arm
            bundles: deb,appimage
            arch: arm64

    steps:
      - uses: actions/checkout@v4

      - name: Install Linux system deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          # xdg-utils：arm runner 上缺 xdg-open 会让打包失败（tauri-action#1319）
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libfuse2 xdg-utils

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_target }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install frontend deps
        run: npm ci

      - name: Build Tauri & upload release assets
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # 应用内更新签名私钥（minisign，无口令）；缺失时 updater 产物 latest.json 无法生成
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        with:
          # 手动触发（workflow_dispatch）时以 main 最新 commit 打预发布 tag；
          # 正常 tag push 时 ref_name 就是 v* 本身
          tagName: ${{ github.event_name == 'workflow_dispatch' && format('v1.9.4-mac-test-{0}', github.sha) || github.ref_name }}
          # Windows 只出 NSIS，latest.json 里指向 *-setup.exe 而非默认的 msi
          releaseName: 'Z·HUB ${{ github.event_name == ''workflow_dispatch'' && format(''v1.9.4-mac-test-{0}'', github.sha) || github.ref_name }}'
          releaseBody: |
            见 [README](https://github.com/${{ github.repository }}/blob/main/README.md) 了解完整功能。

            ## 下载

            - **Windows**：`*_x64-setup.exe`（x64）／`*_arm64-setup.exe`（ARM64）安装包；`*_portable.exe` 便携版
            - **macOS**：`*_aarch64.dmg`（Apple 芯片）／`*_x64.dmg`（Intel 芯片）
            - **Linux**：`*amd64.deb`／`*arm64.deb`／`*.AppImage`

            ## 未签名提示

            - Windows：SmartScreen 选「更多信息 → 仍要运行」
            - macOS：Gatekeeper 右键打开
            - Linux：AppImage 需 `chmod +x`

            SHA-256 校验和见各 `checksums-*.txt`。
          releaseDraft: false
          # 手动触发固定 prerelease（mac-test 不进 latest.json 主推），tag push 沿用含 '-' 即预发布的判定
          prerelease: ${{ github.event_name == 'workflow_dispatch' || contains(github.ref_name, '-') }}
          updaterJsonPreferNsis: true
          args: --bundles ${{ matrix.bundles }} ${{ matrix.rust_target && format('--target {0}', matrix.rust_target) || '' }}

      - name: Upload portable exe + checksums (windows)
        if: runner.os == 'Windows'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUST_TARGET: ${{ matrix.rust_target }}
          ARCH: ${{ matrix.arch }}
          # 手动触发时上传目标与产物名跟随 tauri-action 生成的测试 tag（见 tagName）
          REF_TAG: ${{ github.event_name == 'workflow_dispatch' && format('v1.9.4-mac-test-{0}', github.sha) || github.ref_name }}
        run: |
          VER="${REF_TAG#v}"
          # 指定 --target 时产物在 target/<triple>/release，native 时在 target/release
          if [ -n "$RUST_TARGET" ]; then BUILD_DIR="src-tauri/target/$RUST_TARGET/release"; else BUILD_DIR="src-tauri/target/release"; fi
          cp "$BUILD_DIR/zcode-hub.exe" "zcode-hub_${VER}_${ARCH}_portable.exe"
          SETUP=$(ls "$BUILD_DIR"/bundle/nsis/*-setup.exe | head -1)
          sha256sum "zcode-hub_${VER}_${ARCH}_portable.exe" "$SETUP" | sed 's| .*/| |' > "checksums-Windows-${ARCH}-${REF_TAG}.txt"
          gh release upload "$REF_TAG" "zcode-hub_${VER}_${ARCH}_portable.exe" "checksums-Windows-${ARCH}-${REF_TAG}.txt" --clobber

      - name: Upload checksums
        if: runner.os != 'Windows'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ARCH: ${{ matrix.arch }}
          REF_TAG: ${{ github.event_name == 'workflow_dispatch' && format('v1.9.4-mac-test-{0}', github.sha) || github.ref_name }}
        run: |
          # 用 arch 标签命名：mac 两腿（aarch64/x64）与 linux 两腿（amd64/arm64）互不撞名
          find src-tauri/target -type f \( -name '*.dmg' -o -name '*.deb' -o -name '*.AppImage' \) \
            | xargs sha256sum | sed 's| .*/| |' > "checksums-${RUNNER_OS}-${ARCH}-${REF_TAG}.txt"
          gh release upload "$REF_TAG" "checksums-${RUNNER_OS}-${ARCH}-${REF_TAG}.txt" --clobber

      # 分类式 release notes：conventional commits 按 cliff.toml 分类（🚀 新功能/🐛 修复/🎨 样式/…），
      # 覆盖 tauri-action 的静态 body。Windows 腿执行一次即可，六腿并发 edit 会竞态；
      # 手动触发（mac-test tag）不覆盖。tag push 时 HEAD 即 tag commit，--latest 恰好取该版本区间
      - name: Generate categorized release notes
        if: runner.os == 'Windows' && startsWith(github.ref, 'refs/tags/v') && matrix.arch == 'x64'
        uses: orhun/git-cliff-action@v4
        id: cliff
        with:
          config: cliff.toml
          args: --latest --strip all
        env:
          GITHUB_REPO: ${{ github.repository }}

      - name: Apply release notes
        if: runner.os == 'Windows' && startsWith(github.ref, 'refs/tags/v') && matrix.arch == 'x64'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REF_TAG: ${{ github.ref_name }}
          NOTES: ${{ steps.cliff.outputs.content }}
        run: |
          {
            echo "见 [README](https://github.com/${{ github.repository }}/blob/main/README.md) 了解完整功能"
            echo
            printf '%s\n' "$NOTES"
            echo
            echo "## 下载"
            echo
            echo "- **Windows**：\`*_x64-setup.exe\`（x64）／\`*_arm64-setup.exe\`（ARM64）安装包；\`*_portable.exe\` 便携版"
            echo "- **macOS**：\`*_aarch64.dmg\`（Apple 芯片）／\`*_x64.dmg\`（Intel 芯片）"
            echo "- **Linux**：\`*amd64.deb\`／\`*arm64.deb\`／\`*.AppImage\`"
            echo
            echo "## 未签名提示"
            echo
            echo "- Windows：SmartScreen 选「更多信息 → 仍要运行」"
            echo "- macOS：Gatekeeper 右键打开"
            echo "- Linux：AppImage 需 \`chmod +x\`"
            echo
            echo "SHA-256 校验和见附 \`checksums-*.txt\`。"
          } > release-body.md
          gh release edit "$REF_TAG" --notes-file release-body.md
