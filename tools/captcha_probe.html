<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>captcha probe</title>
</head>
<body>
<div id="cap-holder"></div>
<button id="cap-btn" style="display:none">verify</button>
<pre id="log"></pre>
<script>
// 无痕验证探针：与 zcode-hub src/captcha.js 同一装配（SceneId/mode/element/button/
// startTracelessVerification），产 captchaVerifyParam 存 window.__PARAM 供外部轮询取走。
// 单轮失败（fail/onError/超时）→ location.replace 换 n 重来（桌面端每次领取也是全新 host 进程），
// 最多 MAX 轮；无痕实测成功率约 1/2，靠轮次兜底。
const q = new URLSearchParams(location.search);
const SCENE = q.get("scene") || "";
const N = parseInt(q.get("n") || "1", 10);
const MAX = 4;
const PER_ATTEMPT_MS = 14000; // 桌面端实测 instanceReady 冷启 10.4s，12s 会误杀；放宽到 14s
const $log = document.getElementById("log");
const log = (...a) => { $log.textContent += a.join(" ") + " | t=" + (Date.now() % 100000) + "\n"; };
window.__PARAM = null;
window.__DONE = false;
window.__FAILED = false;
window.__ERR = [];

const SDK_URL = "https://o.alicdn.com/captcha-frontend/aliyunCaptcha/AliyunCaptcha.js";
function loadSdk() {
  return new Promise((resolve, reject) => {
    if (typeof window.initAliyunCaptcha === "function") return resolve();
    const s = document.createElement("script");
    s.src = SDK_URL;
    s.onload = () => resolve();
    s.onerror = () => reject(new Error("sdk load failed"));
    document.head.appendChild(s);
  });
}

let timer = null;
function nextAttempt(why) {
  window.__ERR.push(why);
  if (N >= MAX) { window.__FAILED = true; window.__DONE = true; log("exhausted"); return; }
  log("retry -> n=", N + 1);
  timer = setTimeout(() => location.replace(location.pathname + "?scene=" + encodeURIComponent(SCENE) + "&n=" + (N + 1)), 600);
}

function run() {
  log("attempt n=", N, "scene=", SCENE);
  window.initAliyunCaptcha({
    SceneId: SCENE,
    prefix: q.get("prefix") || "",
    region: q.get("region") || "cn",
    mode: "popup",
    language: "zh-CN",
    showErrorTip: false,
    element: "#cap-holder",
    button: "#cap-btn",
    getInstance: (instance) => {
      log("instance ready, traceless=", typeof instance.startTracelessVerification === "function");
      if (typeof instance.startTracelessVerification === "function") {
        instance.startTracelessVerification();
        timer = setTimeout(() => nextAttempt("timeout-" + N), PER_ATTEMPT_MS);
      } else {
        nextAttempt("no-traceless");
      }
    },
    success: (param) => {
      clearTimeout(timer);
      const v = typeof param === "string" ? param : (param && param.captchaVerifyParam);
      window.__PARAM = v || "";
      window.__DONE = true;
      log("SUCCESS len=", (v || "").length);
    },
    fail: (p) => { clearTimeout(timer); log("fail", JSON.stringify(p).slice(0, 300)); nextAttempt("fail"); },
    onError: (p) => { clearTimeout(timer); log("onError", JSON.stringify(p).slice(0, 300)); nextAttempt("onError"); },
  });
}

loadSdk().then(() => {
  log("sdk loaded");
  try { run(); } catch (e) { log("init throw", String(e)); nextAttempt("throw"); }
}).catch((e) => {
  window.__FAILED = true; window.__DONE = true; window.__ERR.push("sdk:" + String(e));
  log("sdk fatal", String(e));
});
</script>
</body>
</html>
